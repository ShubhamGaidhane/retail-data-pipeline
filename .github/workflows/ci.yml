name: Retail pipeline CI/CD

on:
  pull_request:
    branches: [main]
  push:
    branches: [main]

permissions:
  contents: read

jobs:
  unit-tests:
    runs-on: ubuntu-latest
    timeout-minutes: 5

    steps:
      - name: Check out repository
        uses: actions/checkout@v7

      - name: Set up Python
        uses: actions/setup-python@v7
        with:
          python-version: "3.14"

      - name: Run unit tests
        run: python -m unittest discover -s tests -v

  deploy-dev:
    needs: unit-tests
    if: github.event_name == 'push' && github.ref == 'refs/heads/main'
    runs-on: ubuntu-latest
    timeout-minutes: 20
    environment: databricks-dev

    concurrency:
      group: databricks-dev-deployment
      cancel-in-progress: false

    env:
      DATABRICKS_HOST: ${{ vars.DATABRICKS_HOST }}
      DATABRICKS_CLIENT_ID: ${{ vars.DATABRICKS_CLIENT_ID }}
      DATABRICKS_CLIENT_SECRET: ${{ secrets.DATABRICKS_CLIENT_SECRET }}
      DATABRICKS_AUTH_TYPE: oauth-m2m

    steps:
      - name: Check out repository
        uses: actions/checkout@v7

      - name: Install Databricks CLI
        uses: databricks/setup-cli@v1.16.0

      - name: Validate deployment configuration
        run: databricks bundle validate -t ci

      - name: Deploy development pipeline
        run: databricks bundle deploy -t ci

      - name: Run pipeline and validate sample revenue
        run: databricks bundle run order_revenue_job -t ci