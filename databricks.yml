bundle:
  name: retail-data-pipeline

variables:
  target_schema:
    description: Schema for the sample order table
    default: retail_dev

resources:
  jobs:
    order_revenue_job:
      name: retail-order-revenue-bundle
      max_concurrent_runs: 1
      tasks:
        - task_key: calculate_order_revenue
          notebook_task:
            notebook_path: ./notebooks/order_revenue.py
            base_parameters:
              target_schema: ${var.target_schema}

targets:
  dev:
    default: true
    mode: development
    workspace:
      host: https://dbc-5c5031b0-0b69.cloud.databricks.com

  ci:
    workspace:
      host: https://dbc-5c5031b0-0b69.cloud.databricks.com
            root_path: /Workspace/Users/shubhamgaidhane77@gmail.com/retail-cicd/${bundle.name}/${bundle.target}
    variables:
      target_schema: retail_ci